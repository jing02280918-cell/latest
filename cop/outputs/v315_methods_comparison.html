<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v3.15 四方法攻击成功率 · 同模型对照</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5c6370;
      --border: #e2e5ea;
      --blue: #3b82f6;
      --amber: #d97706;
      --green: #059669;
      --green-light: #d1fae5;
      --blue-light: #dbeafe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 32px 24px 48px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 820px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .card-header {
      padding: 14px 18px;
      font-weight: 600;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
    }
    .card-body { padding: 18px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-value { font-size: 20px; font-weight: 600; margin-top: 2px; }
    .stat-value.green { color: var(--green); }
    .stat-value.amber { color: var(--amber); }
    .chart-caption {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .chart-wrap { width: 100%; overflow-x: auto; }
    svg.chart { display: block; width: 100%; height: auto; }
    .ranking {
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #f0f2f5;
      font-weight: 600;
      font-size: 12px;
      color: var(--muted);
    }
    tr:last-child td { border-bottom: none; }
    .callout {
      background: var(--blue-light);
      border: 1px solid #93c5fd;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 13px;
      color: var(--muted);
    }
    .section { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>v3.15 四方法攻击成功率 · 同模型对照</h1>
    <p class="subtitle">357 条 eval357 样本 · 固定目标模型，比较 V-Drift / PAIR / CoP / PLAGUE</p>

    <div class="grid-2">
      <div class="card" id="panel-deepseek"></div>
      <div class="card" id="panel-qwen"></div>
    </div>

    <div class="section">
      <h2>DeepSeek v4-pro · 方法对照</h2>
      <table id="table-deepseek"></table>
    </div>

    <div class="section">
      <h2>Qwen3.7-Plus · 方法对照</h2>
      <table id="table-qwen"></table>
    </div>

    <div class="callout">
      两个目标模型上 V-Drift R5含补救 均为最高 ASR，且 DeepSeek / Qwen 上均为 PAIR &gt; CoP。
      PLAGUE 在两个模型上均为最低，但在 Qwen 上相对差距更小（75.9% vs 66.7%）。
    </div>
  </div>

  <script>
    const N = 357;
    const METHOD_LABELS = ["V-Drift R5含补救", "PAIR", "CoP", "PLAGUE"];
    const METRICS = [
      "R5含补救 · 行为二元",
      "best_outcome · 行为二元",
      "judge_score ≥ 10",
      "judge_score ≥ 10",
    ];

    const DEEPSEEK = {
      title: "DeepSeek v4-pro",
      color: "#3b82f6",
      refColor: "#059669",
      values: [98.88, 94.68, 93.56, 66.67],
      counts: [353, 338, 334, 238],
      ranking: "V-Drift (98.9%) > PAIR (94.7%) > CoP (93.6%) > PLAGUE (66.7%)",
    };

    const QWEN = {
      title: "Qwen3.7-Plus",
      color: "#d97706",
      refColor: "#059669",
      values: [95.8, 91.88, 90.4, 75.91],
      counts: [342, 328, 323, 271],
      ranking: "V-Drift (95.8%) > PAIR (91.9%) > CoP (90.4%) > PLAGUE (75.9%)",
    };

    function fmtPct(v) {
      return Number.isInteger(v) ? v + "%" : v.toFixed(v % 1 === 0 ? 0 : 1) + "%";
    }

    function renderBarChart(cfg) {
      const W = 460, H = 280;
      const pad = { top: 24, right: 16, bottom: 72, left: 44 };
      const plotW = W - pad.left - pad.right;
      const plotH = H - pad.top - pad.bottom;
      const yMin = 60, yMax = 100;
      const n = cfg.values.length;
      const barW = plotW / n * 0.55;
      const gap = plotW / n;

      const yScale = (v) => pad.top + plotH * (1 - (v - yMin) / (yMax - yMin));
      const refY = yScale(cfg.values[0]);

      let grid = "";
      for (let t = 60; t <= 100; t += 10) {
        const y = yScale(t);
        grid += `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="#e2e5ea" stroke-width="1"/>`;
        grid += `<text x="${pad.left - 8}" y="${y + 4}" text-anchor="end" fill="#5c6370" font-size="11">${t}</text>`;
      }

      let bars = "";
      cfg.values.forEach((v, i) => {
        const x = pad.left + gap * i + (gap - barW) / 2;
        const y = yScale(v);
        const h = pad.top + plotH - y;
        bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${cfg.color}" rx="4"/>`;
        bars += `<text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" fill="${cfg.color}" font-size="11" font-weight="600">${fmtPct(v)}</text>`;
        const label = METHOD_LABELS[i];
        const lines = label.length > 10 ? [label.slice(0, 10), label.slice(10)] : [label];
        lines.forEach((line, li) => {
          bars += `<text x="${x + barW / 2}" y="${pad.top + plotH + 18 + li * 14}" text-anchor="middle" fill="#5c6370" font-size="11">${line}</text>`;
        });
      });

      return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        ${grid}
        <line x1="${pad.left}" y1="${refY}" x2="${W - pad.right}" y2="${refY}" stroke="${cfg.refColor}" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="${W - pad.right}" y="${refY - 4}" text-anchor="end" fill="${cfg.refColor}" font-size="10">V-Drift R5</text>
        ${bars}
        <text x="${W / 2}" y="${H - 6}" text-anchor="middle" fill="#5c6370" font-size="11">攻击方法 · n=${N}</text>
        <text x="12" y="${H / 2}" transform="rotate(-90 12 ${H / 2})" text-anchor="middle" fill="#5c6370" font-size="11">ASR（%）</text>
      </svg>`;
    }

    function renderPanel(id, cfg) {
      const max = Math.max(...cfg.values);
      const min = Math.min(...cfg.values);
      document.getElementById(id).innerHTML = `
        <div class="card-header">目标：${cfg.title}</div>
        <div class="card-body">
          <div class="stats">
            <div class="stat">
              <div class="stat-label">最高 ASR</div>
              <div class="stat-value green">${fmtPct(max)}</div>
            </div>
            <div class="stat">
              <div class="stat-label">最低 ASR</div>
              <div class="stat-value amber">${fmtPct(min)}</div>
            </div>
          </div>
          <div class="chart-caption">纵轴：ASR（%） · 横轴：攻击方法 · n=${N}</div>
          <div class="chart-wrap">${renderBarChart(cfg)}</div>
          <div class="ranking">排序：${cfg.ranking}</div>
        </div>`;
    }

    function renderTable(id, cfg) {
      const rows = METHOD_LABELS.map((label, i) =>
        `<tr><td>${label}</td><td>${METRICS[i]}</td><td>${cfg.counts[i]}/${N}</td><td>${fmtPct(cfg.values[i])}</td></tr>`
      ).join("");
      document.getElementById(id).innerHTML = `
        <thead><tr><th>方法</th><th>判定口径</th><th>成功数</th><th>ASR</th></tr></thead>
        <tbody>${rows}</tbody>`;
    }

    renderPanel("panel-deepseek", DEEPSEEK);
    renderPanel("panel-qwen", QWEN);
    renderTable("table-deepseek", DEEPSEEK);
    renderTable("table-qwen", QWEN);
  </script>
</body>
</html>
